# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write      
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prerender champion grid
        # Reinyecta el grid en el HTML desde data/champions.json para que el
        # contenido exista sin JavaScript. Es idempotente.
        run: python scripts/prerender.py
      - name: Build _site with public files only
        run: |
          mkdir -p _site/assets
          cp index.html 404.html app.js wl.js wl.css sw.js style.css robots.txt sitemap.xml site.webmanifest ads.txt google6dae54fd1f12f3c0.html _site/
          cp -r es privacy data arena-god-easy-champions aram-mayhem-win-tracker lol-win-rate-tracker _site/
          # assets/ sin ini.png (no se referencia en el sitio)
          for f in assets/*; do [ "$(basename "$f")" = "ini.png" ] || cp -r "$f" _site/assets/; done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
